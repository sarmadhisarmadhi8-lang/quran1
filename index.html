    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Base & Background */
        body {
            background-color: #050b14;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #050b14;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
            background-image: radial-gradient(circle at center, #0a1f2e 0%, #050b14 100%);
        }
        .splash-logo {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 3px solid #eab308;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.6);
            animation: splash-pulse 2s infinite alternate;
            object-fit: cover;
        }
        @keyframes splash-pulse {
            0% { transform: scale(0.95) perspective(500px) rotateY(-10deg); box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); }
            100% { transform: scale(1.05) perspective(500px) rotateY(10deg); box-shadow: 0 0 60px rgba(234, 179, 8, 0.8); }
        }
        .splash-title {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            color: #eab308;
            text-shadow: 0 0 20px rgba(234, 179, 8, 0.6);
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            font-weight: bold;
        }

        /* 3D Ambient Floating Orbs */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a1f2e 0%, #050b14 100%);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #064e3b; top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: #854d0e; bottom: -10%; right: -10%; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: #0f766e; top: 40%; left: 50%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 40px) scale(0.9); }
        }

        /* 3D Glassmorphism Cards */
        .glass-card {
            background: var(--cardbg);
            border: 1px solid rgba(234, 179, 8, 0.15);
            border-radius: 1.25rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
            transform-style: preserve-3d;
        }

        .glow-text { text-shadow: 0 0 15px rgba(234, 179, 8, 0.5); }
        .glow-border {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.2), inset 0 0 10px rgba(234, 179, 8, 0.1);
            border-color: rgba(234, 179, 8, 0.4);
        }

        /* Sections */
        .section-content { display: none; opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .section-content.active { display: block; opacity: 1; transform: translateY(0); }
        
        .section-title {
            position: relative; padding-bottom: 0.75rem; margin-bottom: 2.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .section-title::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 5rem; height: 3px; background: linear-gradient(90deg, transparent, #eab308, transparent);
            box-shadow: 0 0 10px #eab308;
        }

        /* Zikr Counter Circles */
        .counter-circle {
            position: relative; width: 140px; height: 140px; border-radius: 50%;
            background: linear-gradient(145deg, rgba(20,40,50,0.8), rgba(5,15,20,0.8));
            box-shadow:  10px 10px 20px rgba(0,0,0,0.5), -5px -5px 15px rgba(255,255,255,0.05), inset 0 0 15px rgba(234, 179, 8, 0.2);
            border: 2px solid rgba(234, 179, 8, 0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.1s;
        }
        .counter-circle:active { transform: scale(0.95); box-shadow:  5px 5px 10px rgba(0,0,0,0.5), inset 0 0 25px rgba(234, 179, 8, 0.4); }

        /* Quran Highlighting */
        .ayah-playing {
            background: linear-gradient(90deg, rgba(234, 179, 8, 0.15), rgba(234, 179, 8, 0.3), rgba(234, 179, 8, 0.15));
            color: #fbbf24;
            padding: 0.25rem 0.5rem; border-radius: 0.5rem;
            border-bottom: 1px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.15);
            transition: all 0.4s ease;
        }
        .bookmark-highlight { animation: pulse-gold 2.5s ease-out; }
        @keyframes pulse-gold {
            0% { background-color: rgba(234, 179, 8, 0.5); box-shadow: 0 0 25px rgba(234, 179, 8, 0.8); }
            100% { background-color: transparent; box-shadow: none; }
        }

        /* Loaders */
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(234, 179, 8, 0.1);
            border-top-color: #eab308; border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #eab308; border-radius: 10px; }
    </style>
</head>
<body class="antialiased font-sans">

    <!-- SPLASH SCREEN -->

    </div>

    <!-- 3D Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Header / Navbar -->
    <nav class="glass-card m-4 p-4 sticky top-4 z-40 flex justify-between items-center bg-opacity-80">
        <button onclick="toggleSidebar()" class="text-2xl text-gold p-2 active:scale-90 transition-transform">
            <i class="fa-solid fa-bars glow-text"></i>
        </button>
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black text-gold tracking-wide glow-text">نور الإيمان</h1>
            <div class="w-11 h-11 rounded-full border-2 border-gold overflow-hidden flex items-center justify-center glow-border">
                <img src="https://sarmadhisarmadhi8-lang.github.io/quran1/nor.jpeg" class="w-full h-full object-cover" alt="Logo">
            </div>
        </div>
    </nav>

    <!-- Sidebar Overlay -->
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Sidebar Menu -->
    <aside id="sidebar" class="fixed top-0 right-0 w-72 h-full z-50 transform translate-x-full transition-transform duration-400 ease-out p-6 flex flex-col glass-card border-r-0 rounded-l-3xl rounded-r-none">
        <div class="flex justify-between items-center mb-10 border-b border-gold/20 pb-4">
            <h2 class="text-2xl font-bold text-gold glow-text"><i class="fa-solid fa-moon mr-2"></i> پێڕست</h2>
            <button onclick="toggleSidebar()" class="text-2xl text-gray-300 p-2 hover:text-gold transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex flex-col gap-3 text-lg">
            <button onclick="navTo('zikr')" class="text-right p-4 rounded-xl hover:bg-gold/10 hover:border-gold/30 border border-transparent transition-all flex items-center gap-3"><i class="fa-solid fa-ring text-gold w-6 text-center"></i> زکرێ رۆژانە</button>
            <button onclick="navTo('prayer')" class="text-right p-4 rounded-xl hover:bg-gold/10 hover:border-gold/30 border border-transparent transition-all flex items-center gap-3"><i class="fa-solid fa-person-praying text-gold w-6 text-center"></i> فێرکرنا نڤێژێ</button>
            <button onclick="navTo('quran')" class="text-right p-4 rounded-xl hover:bg-gold/10 hover:border-gold/30 border border-transparent transition-all flex items-center gap-3"><i class="fa-solid fa-book-quran text-gold w-6 text-center"></i> قورئانا پیرۆز</button>
            <button onclick="navTo('duas')" class="text-right p-4 rounded-xl hover:bg-gold/10 hover:border-gold/30 border border-transparent transition-all flex items-center gap-3"><i class="fa-solid fa-hands-praying text-gold w-6 text-center"></i> دوعایێن خەوێ و رۆژانە</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto p-4 md:p-6 pb-24 min-h-[80vh] relative z-10">

        <!-- 1. ZIKR SECTION -->
        <section id="zikr" class="section-content active">
            <h2 class="text-3xl font-bold text-center text-white section-title">زکرێ رۆژانە</h2>
            <div class="flex flex-col gap-8" id="zikr-container">
                <!-- Loaded via JS -->
            </div>
        </section>

        <!-- 2. PRAYER SECTION -->
        <section id="prayer" class="section-content">
            <h2 class="text-3xl font-bold text-center text-white section-title">فێرکرنا نڤێژێ</h2>
            <div class="glass-card glow-border p-2 rounded-2xl overflow-hidden w-full aspect-video">
                <iframe class="w-full h-full rounded-xl" src="https://www.youtube.com/embed/_az1ktxMoN8?si=hGr3q1LVF0Qnbp7_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
        </section>

        <!-- 3. QURAN SECTION -->
        <section id="quran" class="section-content">
            <!-- List View -->
            <div id="quran-list-view">

                    <h2 class="text-3xl font-bold text-white section-title">قورئانا پیرۆز</h2>

                <!-- SEARCH BAR (NEW FEATURE) -->
                <div class="mb-6 relative">
                    <input type="text" id="surah-search" onkeyup="searchSurah()" placeholder="لێگەڕیان بۆ ناڤێ سورەتێ" class="w-full glass-card bg-white/5 border border-white/20 text-white placeholder-gray-400 p-4 pl-12 rounded-xl focus:outline-none focus:border-gold transition-colors font-quran text-xl">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gold/70 text-lg"></i>
                </div>
                
                <!-- Resume Bookmark Button -->
                <div id="resume-bookmark-container" class="hidden mb-6">
                    <button onclick="resumeBookmark()" class="w-full glass-card glow-border p-5 text-gold font-bold text-center flex items-center justify-center gap-3 active:scale-95 transition-all bg-gold/5 hover:bg-gold/10">
                        <i class="fa-solid fa-location-dot text-xl animate-bounce"></i> <span id="resume-text" class="text-lg">بەردەوام بە ژ جهێ تە هێلای</span>
                    </button>
                </div>

                <div id="surah-grid" class="flex flex-col gap-4">
                    <div class="py-20 flex justify-center"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Reading View -->
            <div id="quran-read-view" class="hidden relative">
                <!-- Sticky Player Bar -->
                <div class="sticky top-4 z-30 glass-card glow-border p-4 mb-6 flex items-center justify-between">
                    <button onclick="closeSurah()" class="w-12 h-12 rounded-full bg-white/5 border border-white/10 text-white flex items-center justify-center active:scale-90 transition-transform hover:bg-white/10">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    
                    <h3 id="current-surah-name" class="font-quran text-3xl font-bold text-gold glow-text"></h3>
                    
                    <button id="play-pause-btn" onclick="togglePlay()" class="w-12 h-12 rounded-full bg-gradient-to-tr from-yellow-600 to-yellow-300 text-darkbg shadow-[0_0_15px_rgba(234,179,8,0.5)] flex items-center justify-center active:scale-90 transition-transform">
                        <i class="fa-solid fa-play ml-1 text-lg"></i>
                    </button>
                </div>

                <!-- Surah Content text -->
                <div class="glass-card p-6 md:p-10 min-h-[50vh] border-t-2 border-t-gold/30">
                    <div id="surah-content" class="text-[26px] md:text-[34px] leading-[2.8] md:leading-[3.2] text-justify direction-rtl font-quran text-gray-100">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. DUAS SECTION -->
        <section id="duas" class="section-content">
            <h2 class="text-3xl font-bold text-center text-white section-title">دوعایێن خەوێ و رۆژانە</h2>
            <div class="flex flex-col gap-6" id="duas-container">
                <!-- Loaded via JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="mt-8 py-6 text-center relative z-10 glass-card rounded-b-none border-b-0 border-l-0 border-r-0">
        <p class="text-gold/80 text-sm flex items-center justify-center gap-2 font-bold">
            <i class="fa-solid fa-hands-praying"></i> دوعایەکا خێرێ بۆ دروستکەرێ مالپەڕی بکەن 
        </p>
    </footer>

    <!-- Hidden Audio Player -->
    <audio id="quran-audio" preload="none"></audio>

    <script>
        // --- SPLASH SCREEN LOGIC ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                }
            }, 2500);

            initData();
        });

        function initData() {
            checkDailyReset();
            renderZikr();
            renderDuas();
            loadSurahs();
        }

        // --- NAVIGATION ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function navTo(sectionId) {
            document.querySelectorAll('.section-content').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
            toggleSidebar();
            if(sectionId !== 'quran') stopAudio();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- DATA MANAGEMENT & RESET AT MIDNIGHT ---
        function checkDailyReset() {
            const today = new Date().toLocaleDateString('en-GB'); 
            if (localStorage.getItem('app_date') !== today) {
                localStorage.setItem('app_date', today);
                localStorage.setItem('counters_data', JSON.stringify({}));
            }
        }

        function getCounts() { return JSON.parse(localStorage.getItem('counters_data') || '{}'); }
        function saveCount(id, val) {
            let c = getCounts(); c[id] = val;
            localStorage.setItem('counters_data', JSON.stringify(c));
        }
        function toArabicNum(num) {
            const ar = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).split('').map(c => ar[c] ? ar[c] : c).join('');
        }

        // --- ZIKR LOGIC ---
        const zikrData = [
            { id: 'z1', text: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', target: 100 },
            { id: 'z2', text: 'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ', target: 100 },
            { id: 'z3', text: 'لَا إِلَهَ إِلَّا اللَّهُ', target: 100 },
            { id: 'z4', text: 'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ', target: 100 }
        ];

        function incrementZikr(id, target) {
            checkDailyReset();
            let curr = getCounts()[id] || 0;
            if (curr < target) { saveCount(id, curr + 1); renderZikr(); }
        }

        function resetZikr(id) { saveCount(id, 0); renderZikr(); }

        function renderZikr() {
            const counts = getCounts();
            const container = document.getElementById('zikr-container');
            container.innerHTML = '';
            
            zikrData.forEach(z => {
                const curr = counts[z.id] || 0;
                container.innerHTML += `
                    <div class="glass-card p-8 flex flex-col items-center relative">
                        <h3 class="font-quran text-4xl text-white mb-10 glow-text text-center leading-normal">${z.text}</h3>
                        <button onclick="incrementZikr('${z.id}', ${z.target})" class="counter-circle mb-6 group cursor-pointer">
                            <span class="text-6xl font-black text-gold group-active:scale-110 transition-transform">${curr}</span>
                            <span class="text-sm text-gray-300 mt-2 font-bold">ژ ${z.target}</span>
                        </button>
                        <button onclick="resetZikr('${z.id}')" class="border border-white/20 rounded-full px-5 py-2 text-sm text-gray-400 hover:text-white hover:border-gold hover:bg-gold/10 transition-all active:scale-95">
                            دووبارەکرن <i class="fa-solid fa-rotate-right ml-1"></i>
                        </button>
                    </div>`;
            });
        }

        // --- DUAS LOGIC ---
        const duasData = [
            { id: 'd1', title: 'دوعایا نڤستنێ', arabic: 'بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ', kurdish: 'ب ناڤێ تە یا خودێ ئەز دنڤم و رادبم.', target: 3 },
            { id: 'd2', title: 'دوعایا رابوونێ', arabic: 'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا', kurdish: 'سوپاس بۆ وی خودایێ پشتی ئەم نڤاندین ئەم ساخکرینەڤە.', target: 3 },
            { id: 'd3', title: 'چوونە دەستئاڤێ', arabic: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ', kurdish: 'یا خودێ ئەز ب تە دهێمە پاراستن ژ پیسی و شەیتانێن نێر و مێ.', target: 3 },
            { id: 'd4', title: 'دەرکەفتن ژ دەستئاڤێ', arabic: 'غُفْرَانَكَ', kurdish: 'لێخۆشبوونا تە دخوازم یا خودێ.', target: 3 }
        ];

        function incrementDua(id, target) {
            checkDailyReset();
            let curr = getCounts()[id] || 0;
            if (curr < target) { saveCount(id, curr + 1); renderDuas(); }
        }

        function renderDuas() {
            const counts = getCounts();
            const container = document.getElementById('duas-container');
            container.innerHTML = '';
            
            duasData.forEach(d => {
                const curr = counts[d.id] || 0;
                const isDone = curr >= d.target;
                container.innerHTML += `
                    <div class="glass-card p-6 flex flex-col items-center text-center">
                        <h3 class="text-2xl font-black text-gold mb-4 border-b border-white/10 pb-3 w-full">${d.title}</h3>
                        <p class="font-quran text-3xl text-gray-100 mb-5 leading-[2.2]">"${d.arabic}"</p>
                        <p class="text-white text-base mb-6 bg-white/5 border border-white/10 py-3 px-5 rounded-xl shadow-inner w-full">${d.kurdish}</p>
                        
                        <button onclick="incrementDua('${d.id}', ${d.target})" class="w-full py-4 rounded-xl font-bold text-lg transition-all shadow-lg ${isDone ? 'bg-gradient-to-r from-green-600 to-emerald-500 text-white shadow-green-500/30 cursor-default' : 'bg-gradient-to-r from-yellow-600 to-yellow-400 text-darkbg shadow-yellow-500/30 active:scale-[0.98]'}">
                            <span>${isDone ? '<i class="fa-solid fa-check-circle mr-2"></i> تەمام بوو' : `خاندن: ${curr} / ${d.target}`}</span>
                        </button>
                    </div>`;
            });
        }

        // --- QURAN LOGIC & SEARCH ---
        let quranData = [];
        let currentAyahs = [];
        let playingIndex = -1;
        const audioPlayer = document.getElementById('quran-audio');
        const playBtn = document.getElementById('play-pause-btn');

        async function loadSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                if(data.code === 200) {
                    quranData = data.data;
                    renderSurahList(quranData);
                }
            } catch (e) {
                document.getElementById('surah-grid').innerHTML = '<p class="text-center text-red-400 font-bold mt-4">کێشە د هێلا ئینتەرنێتێ دا هەیە. تکایە ریفرێش بکە.</p>';
            }
        }

        // TEXT NORMALIZATION FUNCTION
        function normalizeArabic(text) {
            if (!text) return '';
            return text
                // Remove diacritics (tashkeel/harakat)
                .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
                // Normalize Alef variations
                .replace(/[أإآٱ]/g, 'ا')
                // Normalize Teh Marbuta to Haa
                .replace(/ة/g, 'ه')
                // Normalize Ya / Alef Maksura
                .replace(/[ىي]/g, 'ي');
        }

        function searchSurah() {
            const searchInput = document.getElementById('surah-search').value;
            const normalizedQuery = normalizeArabic(searchInput);
            
            const filteredSurahs = quranData.filter(s => {
                const normalizedSurahName = normalizeArabic(s.name);
                return normalizedSurahName.includes(normalizedQuery);
            });
            
            renderSurahList(filteredSurahs);
        }

        function renderSurahList(surahsToRender) {
            const grid = document.getElementById('surah-grid');
            grid.innerHTML = '';
            
            if (surahsToRender.length === 0) {
                grid.innerHTML = '<p class="text-center text-gray-400 font-bold mt-8 text-xl">چ سورەت ب ڤی ناڤی نەهاتنە دیتن.</p>';
                return;
            }

            surahsToRender.forEach(s => {
                const type = s.revelationType === "Meccan" ? "مەککی" : "مەدەنی";
                grid.innerHTML += `
                    <div onclick="fetchSurah(${s.number}, '${s.name}')" class="glass-card p-5 flex items-center justify-between cursor-pointer hover:bg-white/5 hover:border-gold/50 transition-all group">
                        <div class="text-right">
                            <h4 class="font-quran text-3xl text-white group-hover:text-gold transition-colors">${s.name}</h4>
                            <p class="text-sm text-gray-400 mt-2 font-bold">${type} - ${s.numberOfAyahs} ئایەت</p>
                        </div>
                        <div class="w-12 h-12 rounded-full border-2 border-gold/50 flex items-center justify-center text-gold font-black text-lg bg-black/40 group-hover:bg-gold group-hover:text-darkbg transition-colors shadow-[0_0_10px_rgba(234,179,8,0.2)]">
                            ${s.number}
                        </div>
                    </div>`;
            });
            updateBookmarkUI();
        }

        async function fetchSurah(number, name, scrollToAyah = null) {
            document.getElementById('surah-search').value = ''; // Clear search when opening a surah
            searchSurah(); // Reset the list behind the scenes

            document.getElementById('quran-list-view').classList.add('hidden');
            document.getElementById('quran-read-view').classList.remove('hidden');
            document.getElementById('current-surah-name').innerText = name;
            
            const content = document.getElementById('surah-content');
            content.innerHTML = `<div class="py-32 flex justify-center"><div class="spinner"></div></div>`;
            stopAudio();

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${number}/ar.alafasy`);
                const data = await res.json();
                if (data.code === 200) {
                    currentAyahs = data.data.ayahs;
                    renderSurahText(number, name, scrollToAyah);
                }
            } catch (e) {
                content.innerHTML = `<div class="text-center py-20"><p class="text-red-400 mb-6 font-bold text-xl">ئینتەرنێتا تە یا لاوازە.</p><button onclick="closeSurah()" class="bg-white/10 border border-white/20 px-6 py-3 rounded-xl text-white active:scale-95">ڤەگەڕیان</button></div>`;
            }
        }

        function renderSurahText(surahNum, surahName, scrollToAyah) {
            let html = '';
            if (surahNum !== 1 && surahNum !== 9) {
                html += '<div class="text-center text-4xl md:text-5xl text-gold mb-10 font-bold drop-shadow-lg">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>';
            }

            const bm = JSON.parse(localStorage.getItem('quran_bookmark'));

            const ayahsHtml = currentAyahs.map((ayah, i) => {
                const isBookmarked = (bm && bm.surahNum === surahNum && bm.index === i);
                return `
                    <span id="ayah-${i}" class="inline cursor-pointer transition-all duration-300 relative rounded-md leading-[3.5]" onclick="playSpecificAyah(${i})">
                        ${ayah.text} 
                        <span class="text-gold text-2xl md:text-3xl mx-2 drop-shadow-md whitespace-nowrap">﴿${toArabicNum(ayah.numberInSurah)}﴾</span>
                        <button onclick="setBookmark(event, ${surahNum}, '${surahName}', ${i})" class="mx-1 text-xl md:text-2xl align-middle ${isBookmarked ? 'text-gold drop-shadow-[0_0_8px_rgba(234,179,8,0.8)] scale-110' : 'text-gray-600 hover:text-gray-400'} transition-all px-1">
                            <i class="fa-solid fa-thumbtack ${isBookmarked ? '' : '-rotate-45'}"></i>
                        </button>
                    </span> `;
            }).join('');

            html += ayahsHtml;
            document.getElementById('surah-content').innerHTML = html;
            window.scrollTo(0, 0);

            if (scrollToAyah !== null) {
                setTimeout(() => {
                    const el = document.getElementById(`ayah-${scrollToAyah}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('bookmark-highlight');
                    }
                }, 400);
            }
        }

        function closeSurah() {
            stopAudio();
            document.getElementById('quran-read-view').classList.add('hidden');
            document.getElementById('quran-list-view').classList.remove('hidden');
            updateBookmarkUI();
            window.scrollTo(0, 0);
        }

        function togglePlay() {
            if (!currentAyahs.length) return;
            if (!audioPlayer.paused) {
                audioPlayer.pause();
                updateUIState(false);
            } else {
                if (playingIndex === -1) playingIndex = 0;
                playAyahObj(playingIndex);
            }
        }

        function playSpecificAyah(index) {
            playingIndex = index;
            playAyahObj(index);
        }

        function playAyahObj(index) {
            if (index >= currentAyahs.length) {
                stopAudio();
                return;
            }
            playingIndex = index;
            
            document.querySelectorAll('span[id^="ayah-"]').forEach(el => el.classList.remove('ayah-playing'));
            
            const currentEl = document.getElementById(`ayah-${index}`);
            if (currentEl) {
                currentEl.classList.add('ayah-playing');
                const yOffset = -200; 
                const y = currentEl.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({top: y, behavior: 'smooth'});
            }

            audioPlayer.src = currentAyahs[index].audio;
            audioPlayer.load();
            
            const playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    updateUIState(true);
                }).catch(err => updateUIState(false));
            }
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            playingIndex = -1;
            updateUIState(false);
            document.querySelectorAll('span[id^="ayah-"]').forEach(el => el.classList.remove('ayah-playing'));
        }

        function updateUIState(isPlaying) {
            if (isPlaying) {
                playBtn.innerHTML = '<i class="fa-solid fa-pause text-xl"></i>';
                playBtn.classList.add('animate-pulse');
            } else {
                playBtn.innerHTML = '<i class="fa-solid fa-play ml-1 text-xl"></i>';
                playBtn.classList.remove('animate-pulse');
            }
        }

        audioPlayer.addEventListener('ended', () => {
            playAyahObj(playingIndex + 1); 
        });

        // --- BOOKMARK LOGIC ---
        function setBookmark(e, surahNum, surahName, index) {
            e.stopPropagation();
            const data = { surahNum, surahName, index };
            localStorage.setItem('quran_bookmark', JSON.stringify(data));
            
            document.querySelectorAll('.fa-thumbtack').forEach(icon => {
                icon.parentElement.classList.remove('text-gold', 'drop-shadow-[0_0_8px_rgba(234,179,8,0.8)]', 'scale-110');
                icon.parentElement.classList.add('text-gray-600');
                icon.classList.add('-rotate-45');
            });
            
            const clickedBtn = e.currentTarget;
            clickedBtn.classList.remove('text-gray-600');
            clickedBtn.classList.add('text-gold', 'drop-shadow-[0_0_8px_rgba(234,179,8,0.8)]', 'scale-110');
            clickedBtn.querySelector('i').classList.remove('-rotate-45');
        }

        function updateBookmarkUI() {
            const bm = JSON.parse(localStorage.getItem('quran_bookmark'));
            const container = document.getElementById('resume-bookmark-container');
            const text = document.getElementById('resume-text');
            
            if (bm && container) {
                container.classList.remove('hidden');
                text.innerText = `بەردەوام بە: ${bm.surahName} - ئایەتا ${toArabicNum(bm.index + 1)}`;
            }
        }

        function resumeBookmark() {
            const bm = JSON.parse(localStorage.getItem('quran_bookmark'));
            if (bm) fetchSurah(bm.surahNum, bm.surahName, bm.index);
        }
    </script>
</body>
</html>
