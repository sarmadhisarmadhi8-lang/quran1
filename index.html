
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نور الإيمان</title>
    
    <!-- Security & API Meta Tags -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com https://server8.mp3quran.net https://*.mp3quran.net https://www.youtube.com https://youtube.com https://api.alquran.cloud https://cdn.islamic.network data: blob:;">

    <!-- WhatsApp & Social Media Meta Tags -->
    <meta property="og:title" content="نور الإيمان" />
    <meta property="og:description" content="مالپەڕێ نور الإيمان بۆ خاندنا قورئانا پیرۆز، زکر و دوعایێن رۆژانە" />
    <meta property="og:image" content="https://sarmadhisarmadhi8-lang.github.io/quran1/nor.jpeg" />
    <meta property="og:url" content="https://sarmadhisarmadhi8-lang.github.io/quran1/" />
    <meta property="og:type" content="website" />

    <!-- PWA Settings -->
    <link rel="apple-touch-icon" href="nor.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="نور الإيمان">
    <link rel="icon" type="image/jpeg" href="nor.jpeg">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Premium Ultra 3D Dark Theme Colors */
            --bg-color: #0d1313;
            --shadow-light: #131c1c;
            --shadow-dark: #070a0a;
            --accent: #E8C895; /* Bright Gold */
            --accent-glow: rgba(232, 200, 149, 0.4);
            --text-light: #F8F8F8;
            --text-dim: #A0AAB2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #152222 0%, var(--bg-color) 70%);
        }

        /* ----- SPLASH SCREEN ----- */
        #splash-screen {
            position: fixed;
            inset: 0; 
            background-color: var(--bg-color);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        
        .splash-logo-container {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light), 0 0 40px var(--accent-glow);
            margin-bottom: 25px;
            background-color: transparent;
            animation: floatLogo 3s ease-in-out infinite;
        }
        .splash-logo {
            width: 125%;
            height: 125%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .splash-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 4rem;
            color: var(--accent);
            text-shadow: 3px 3px 6px var(--shadow-dark), 0 0 15px var(--accent-glow);
            animation: fadeIn 2s ease;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); box-shadow: 20px 20px 40px var(--shadow-dark), -20px -20px 40px var(--shadow-light), 0 0 60px var(--accent-glow); }
            100% { transform: translateY(0px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ----- MAIN APP ----- */
        .app-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Ultra 3D Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(145deg, #0e1515, #0b1111);
            border-radius: 25px;
            margin-bottom: 35px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            position: sticky;
            top: 20px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.02);
        }
        
        .header-logo-container {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            border: 2px solid var(--accent);
        }
        .site-logo {
            width: 125%;
            height: 125%;
            object-fit: cover;
        }
        
        .logo-text { 
            font-family: 'Aref Ruqaa', serif;
            font-size: 2.2rem; 
            color: var(--accent); 
            font-weight: 700;
            text-shadow: 2px 2px 4px var(--shadow-dark);
            background: -webkit-linear-gradient(45deg, #E8C895, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .menu-btn { background: none; border: none; color: var(--accent); font-size: 1.8rem; cursor: pointer; text-shadow: 2px 2px 4px var(--shadow-dark); }

        /* Section Titles */
        .section-title {
            text-align: center;
            font-size: 2.4rem;
            margin-bottom: 35px;
            color: var(--text-light);
            text-shadow: 2px 2px 4px var(--shadow-dark);
        }
        .section-title span {
            border-bottom: 3px solid var(--accent);
            padding-bottom: 5px;
        }

        /* Super 3D Neumorphism Cards */
        .neu-card {
            background: linear-gradient(145deg, #0e1515, #0b1111);
            border-radius: 25px;
            padding: 30px 25px;
            margin-bottom: 25px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            border: 1px solid rgba(232, 200, 149, 0.05); 
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .neu-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(232,200,149,0.03) 0%, transparent 60%);
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
        }
        .neu-card:hover::before { opacity: 1; }

        /* 3D Circular Counter Button */
        .counter-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #0e1515, #0b1111);
            border: none;
            color: var(--accent);
            font-size: 3.8rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 25px auto;
            cursor: pointer;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            transition: all 0.2s ease;
            text-shadow: 2px 2px 5px #000;
        }
        .counter-btn:active {
            box-shadow: inset 12px 12px 24px var(--shadow-dark), inset -12px -12px 24px var(--shadow-light);
            color: #fff;
            transform: scale(0.98);
        }
        .counter-target { font-size: 1.2rem; opacity: 0.7; margin-top: 5px; font-weight: normal; color: var(--text-light); text-shadow: none; }
        
        .reset-btn {
            display: block;
            margin: 0 auto;
            background: linear-gradient(145deg, #0e1515, #0b1111);
            border: none;
            color: var(--text-dim);
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: 0.2s;
        }
        .reset-btn:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
        }

        /* Dua 3D Button */
        .dua-action-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(145deg, #0e1515, #0b1111);
            border: none;
            border-radius: 18px;
            color: var(--accent);
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 25px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
        }
        .dua-action-btn:active {
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            transform: scale(0.98);
        }
        .dua-action-btn.completed {
            color: #2ecc71;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
        }

        /* Quran Search */
        .search-box {
            width: 100%;
            padding: 20px 25px;
            border-radius: 20px;
            background-color: var(--bg-color);
            border: none;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 25px;
            outline: none;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            transition: 0.3s;
        }
        .search-box:focus {
            box-shadow: inset 10px 10px 20px var(--shadow-dark), inset -10px -10px 20px var(--shadow-light), 0 0 15px var(--accent-glow);
        }

        .continue-reading-btn {
            display: none;
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #E8C895, #c9a56c);
            color: #000;
            border: none;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(232, 200, 149, 0.2);
            transition: 0.2s;
        }
        .continue-reading-btn:active { transform: scale(0.98); }

        .surah-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 25px;
            background: linear-gradient(145deg, #0e1515, #0b1111);
            border-radius: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.01);
        }
        .surah-item:active { box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light); }
        .surah-info { text-align: left; }
        .surah-name { font-family: 'Amiri', serif; font-size: 2.2rem; color: white; margin-bottom: 5px; text-shadow: 1px 1px 3px #000;}
        .surah-details { font-size: 1rem; color: var(--accent); }
        .surah-number {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.4rem;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }

        /* Ayah Design - Deep Inset Shadow for 3D Carved effect */
        .ayah {
            font-family: 'Amiri', serif;
            font-size: 2.4rem;
            line-height: 2.4;
            text-align: justify;
            margin-bottom: 35px;
            padding: 25px;
            border-radius: 18px;
            transition: all 0.4s ease;
            position: relative;
        }
        .ayah.active-ayah { 
            background-color: var(--bg-color);
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            color: var(--accent);
        }
        .bookmark-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.15);
            font-size: 1.6rem;
            cursor: pointer;
            margin-right: 15px;
            transition: 0.3s;
        }
        .bookmark-btn.active { color: var(--accent); text-shadow: 0 0 20px var(--accent); transform: scale(1.2); }

        /* Audio Player 3D */
        .audio-player-fixed {
            background: linear-gradient(145deg, #0e1515, #0b1111);
            border-radius: 25px;
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            position: sticky;
            top: 100px;
            z-index: 90;
            border: 1px solid rgba(232, 200, 149, 0.1);
        }
        .play-btn {
            background: linear-gradient(145deg, #0e1515, #0b1111);
            color: var(--accent);
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: 0.2s;
        }
        .play-btn:active { box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); transform: scale(0.95); }

        .speed-btn {
            background: linear-gradient(145deg, #0e1515, #0b1111);
            color: var(--text-dim);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            transition: 0.2s;
        }
        .speed-btn:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--accent); }

        .player-info {
            text-align: center;
            flex: 1;
        }

        /* Sidebar Menu 3D */
        .side-menu {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100vh;
            background-color: var(--bg-color);
            padding: 30px 25px;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10000;
            box-shadow: -15px 0 40px rgba(0,0,0,0.9);
            border-left: 1px solid rgba(255,255,255,0.02);
        }
        .side-menu.active { right: 0; }
        
        .menu-item {
            padding: 20px;
            border-radius: 18px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(145deg, #0e1515, #0b1111);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            margin-bottom: 22px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .menu-item:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            color: var(--accent);
            transform: scale(0.98);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
        }
        .overlay.active { display: block; }
        
        .section { display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .section.active { display: block; }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        .top-bar { display: flex; align-items: center; margin-bottom: 25px; gap: 20px; }
        .back-btn { background: linear-gradient(145deg, #0e1515, #0b1111); border: none; color: var(--accent); width: 55px; height: 55px; border-radius: 50%; cursor: pointer; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); font-size:1.2rem; }
        .back-btn:active { box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); }
        
        .quran-loader { display: none; text-align: center; padding: 50px 0; color: var(--accent); font-size: 1.8rem; text-shadow: 0 0 10px var(--accent-glow); }
    </style>
</head>
<body>
    <!-- Premium Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <img src="nor.jpeg" alt="نور الإيمان" class="splash-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'none\'/></svg>'">
        </div>
        <h1 class="splash-title">نور الإيمان</h1>
    </div>

    <div class="app-container">
        <!-- Premium Header -->
        <header class="header">
            <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
            <div style="display:flex; align-items:center; gap:15px;">
                <span class="logo-text">نور الإيمان</span>
                <div class="header-logo-container">
                    <img src="nor.jpeg" alt="Logo" class="site-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'none\'/></svg>'">
                </div>
            </div>
        </header>

        <!-- Zikr Section -->
        <main id="zikr-section" class="section active">
            <h2 class="section-title"><span>زکرێ رۆژانە</span></h2>
            <div id="zikr-container"></div>
        </main>

        <!-- Quran List Section -->
        <main id="quran-list-section" class="section">
            <h2 class="section-title"><span>قورئانا پیرۆز</span></h2>
            <p style="text-align: center; color: var(--text-dim); margin-bottom: 25px;">١١٤ سورەت - دەنگێ مشاري العفاسي</p>
            <button id="continue-reading-btn" class="continue-reading-btn" onclick="continueReading()">
                <i class="fas fa-bookmark"></i> بەردەوام بە ژ جهێ تە هێلای
            </button>
            <input type="text" id="surah-search" class="search-box" placeholder="ل ناڤێ سورەتێ بگەڕە..." onkeyup="searchSurah()">
            <div id="surahs-container"></div>
        </main>

        <!-- Quran Reader Section -->
        <main id="quran-reader-section" class="section">
            <div class="top-bar">
                <button class="back-btn" onclick="showSection('quran-list-section')"><i class="fas fa-arrow-right"></i></button>
                <h2 id="current-surah-name" style="font-family: 'Aref Ruqaa'; color: var(--accent); font-size: 2.8rem; text-shadow: 2px 2px 4px var(--shadow-dark);"></h2>
            </div>
            
            <div class="audio-player-fixed">
                <button id="quran-play-btn" class="play-btn" onclick="toggleQuranAudio()">
                    <i class="fas fa-play"></i>
                </button>
                <div class="player-info">
                    <h4 style="color: white; margin-bottom: 3px; font-size: 1.1rem;">مشاري العفاسي</h4>
                    <p style="color: var(--accent); font-size: 0.9rem;">لۆتۆسکرۆل چالاکە</p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <!-- Speed Control Button -->
                    <button id="speed-btn" class="speed-btn" onclick="toggleAudioSpeed()">
                        <span id="speed-btn-text">1x</span>
                    </button>
                    <button class="play-btn" onclick="stopQuranAudio()">
                        <i class="fas fa-stop"></i>
                    </button>
                </div>
            </div>

            <div class="quran-loader" id="quran-loader"><i class="fas fa-spinner fa-spin"></i> ئایەت دهێن...</div>
            <div id="ayahs-container" class="neu-card" style="padding: 15px;"></div>
        </main>

        <!-- Prayer Section -->
        <main id="prayer-section" class="section">
            <h2 class="section-title"><span>فێرکرنا نڤێژێ</span></h2>
            <div class="neu-card">
                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px;">
                    <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" src="https://www.youtube.com/embed/73nsf5jupHo?si=3QwXANFxLTctAKqX" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
        </main>

        <!-- Dua Section -->
        <main id="dua-section" class="section">
            <h2 class="section-title"><span>دوعایێن خەوێ و رۆژانە</span></h2>
            <div id="dua-container"></div>
        </main>
    </div>

    <!-- Sidebar Menu -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="side-menu" id="side-menu">
        <button onclick="toggleMenu()" style="color:var(--text-dim); font-size:2rem; background:none; border:none; cursor:pointer;"><i class="fas fa-times"></i></button>
        <h3 style="font-family: 'Aref Ruqaa', serif; color: var(--accent); text-align: center; margin-top: 10px; font-size: 3.5rem; margin-bottom: 40px; text-shadow: 2px 2px 4px var(--shadow-dark);">نور الإيمان</h3>
        
        <div>
            <div class="menu-item" onclick="showSection('zikr-section'); toggleMenu();">
                <i class="fas fa-ring" style="color:var(--accent); width:30px; font-size:1.4rem;"></i> زکرێ رۆژانە
            </div>
            <div class="menu-item" onclick="showSection('prayer-section'); toggleMenu();">
                <i class="fas fa-praying-hands" style="color:var(--accent); width:30px; font-size:1.4rem;"></i> فێرکرنا نڤێژێ
            </div>
            <div class="menu-item" onclick="showSection('quran-list-section'); toggleMenu();">
                <i class="fas fa-book-quran" style="color:var(--accent); width:30px; font-size:1.4rem;"></i> قورئانا پیرۆز
            </div>
            <div class="menu-item" onclick="showSection('dua-section'); toggleMenu();">
                <i class="fas fa-hands-praying" style="color:var(--accent); width:30px; font-size:1.4rem;"></i> دوعایێن خەوێ و رۆژانە
            </div>
        </div>
    </nav>

    <script>
        // Security
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Splash Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 600);
            }, 2500);
            checkDailyReset();
            checkBookmark();
        });

        // Menu Logic
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
            if(sectionId !== 'quran-reader-section' && typeof stopQuranAudio === 'function') {
                stopQuranAudio();
            }
        }

        // Daily Reset
        function checkDailyReset() {
            const lastReset = localStorage.getItem('lastResetDate');
            const today = new Date().toLocaleDateString();
            if (lastReset !== today) {
                duas.forEach((_, i) => localStorage.setItem(`dua_count_${i}`, 0));
                localStorage.setItem('lastResetDate', today);
            }
        }

        // Zikr
        const azkar = [
            { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", target: 100 },
            { text: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", target: 100 },
            { text: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", target: 100 }
        ];

        function renderAzkar() {
            const container = document.getElementById('zikr-container');
            container.innerHTML = '';
            azkar.forEach((zkr, index) => {
                const card = document.createElement('div');
                card.className = 'neu-card';
                card.innerHTML = `
                    <h3 style="font-family:'Amiri'; text-align:center; font-size:2.4rem; margin-bottom:20px; text-shadow:2px 2px 4px #000;">${zkr.text}</h3>
                    <button class="counter-btn" id="btn-${index}" onclick="incrementZikr(${index}, ${zkr.target})">
                        <span id="count-${index}">0</span>
                        <span class="counter-target">ژ ${zkr.target}</span>
                    </button>
                    <button class="reset-btn" onclick="resetZikr(${index})"><i class="fas fa-redo"></i> دووبارەکرن</button>
                `;
                container.appendChild(card);
            });
        }

        function incrementZikr(id, target) {
            const countSpan = document.getElementById(`count-${id}`);
            let count = parseInt(countSpan.innerText);
            if (count < target) {
                countSpan.innerText = ++count;
                if(window.navigator.vibrate) window.navigator.vibrate(50);
            }
        }
        function resetZikr(id) { document.getElementById(`count-${id}`).innerText = '0'; }
        renderAzkar();

        // Dua 
        const duas = [
            { arabic: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وبِكَ أَرْفَعُهُ..." },
            { arabic: "اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا..." },
            { arabic: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا" },
            { arabic: "بِسْمِ اللَّهِ ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ" },
            { arabic: "غُفْرَانَكَ" }
        ];

        function renderDuas() {
            const container = document.getElementById('dua-container');
            container.innerHTML = '';
            duas.forEach((dua, index) => {
                let savedCount = parseInt(localStorage.getItem(`dua_count_${index}`)) || 0;
                let isCompleted = savedCount >= 3;
                const card = document.createElement('div');
                card.className = 'neu-card';
                
                card.innerHTML = `
                    <div style="background-color:var(--bg-color); border-radius:18px; padding:30px 20px; margin-bottom:20px; box-shadow:inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);">
                        <p style="font-family:'Amiri'; font-size:2.2rem; text-align:center; line-height:2.2; color:var(--text-light); text-shadow:2px 2px 4px #000;">${dua.arabic}</p>
                    </div>
                    <button id="dua-btn-${index}" class="dua-action-btn ${isCompleted ? 'completed' : ''}" onclick="incrementDua(${index})">
                        ${isCompleted ? 'تەمام بوو ✔' : `خاندن (${savedCount}/3)`}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function incrementDua(index) {
            let count = parseInt(localStorage.getItem(`dua_count_${index}`)) || 0;
            if (count < 3) {
                count++;
                localStorage.setItem(`dua_count_${index}`, count);
                const btn = document.getElementById(`dua-btn-${index}`);
                btn.className = `dua-action-btn ${count >= 3 ? 'completed' : ''}`;
                btn.innerHTML = count >= 3 ? 'تەمام بوو ✔' : `خاندن (${count}/3)`;
                if(window.navigator.vibrate) window.navigator.vibrate(30);
            }
        }
        renderDuas();

        // Quran Audio & Speed Logic for iOS
        let surahList = [], ayahTimings = [], currentAyahIndex = 0;
        let globalAudio = new Audio();
        
        // Audio Speed Controls
        const playbackSpeeds = [1.0, 1.25, 1.5, 2.0, 0.5, 0.75];
        let currentSpeedIndex = 0;

        function toggleAudioSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            const newSpeed = playbackSpeeds[currentSpeedIndex];
            globalAudio.playbackRate = newSpeed;
            document.getElementById('speed-btn-text').innerText = newSpeed + 'x';
        }
        
        const removeDiacritics = str => str.replace(/[ًٌٍَُِّْٰ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه');

        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                surahList = (await res.json()).data;
                renderSurahs(surahList);
            } catch (e) { console.error(e); }
        }

        function renderSurahs(list) {
            const container = document.getElementById('surahs-container');
            container.innerHTML = '';
            list.forEach(surah => {
                const div = document.createElement('div');
                div.className = 'surah-item';
                div.onclick = () => loadSurah(surah.number, surah.name);
                div.innerHTML = `
                    <div class="surah-info">
                        <div class="surah-name">${surah.name}</div>
                        <div class="surah-details">${surah.revelationType === 'Meccan' ? 'مەککی' : 'مەدەنی'} - ${surah.numberOfAyahs} ئایەت</div>
                    </div>
                    <div class="surah-number">${surah.number}</div>
                `;
                container.appendChild(div);
            });
        }

        function searchSurah() {
            const input = removeDiacritics(document.getElementById('surah-search').value.toLowerCase());
            renderSurahs(surahList.filter(s => removeDiacritics(s.name).includes(input) || removeDiacritics(s.englishName.toLowerCase()).includes(input)));
        }

        async function loadSurah(number, name, scrollToAyah = null) {
            showSection('quran-reader-section');
            document.getElementById('current-surah-name').innerText = name;
            document.getElementById('quran-loader').style.display = 'block';
            const container = document.getElementById('ayahs-container');
            container.innerHTML = '';
            stopQuranAudio();
            
            try {
                const data = (await (await fetch(`https://api.alquran.cloud/v1/surah/${number}/ar.alafasy`)).json()).data;
                document.getElementById('quran-loader').style.display = 'none';
                
                ayahTimings = data.ayahs.map(a => a.audio);
                data.ayahs.forEach((ayah, index) => {
                    let text = ayah.text;
                    if(number !== 1 && index === 0 && text.startsWith("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ")) {
                        text = text.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
                        if(index === 0) container.innerHTML += `<div style="text-align:center; font-family:'Amiri'; font-size:2.5rem; margin-bottom:40px; color:var(--accent); text-shadow: 0 0 10px rgba(232,200,149,0.3);">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                    }
                    
                    const saved = JSON.parse(localStorage.getItem('quranBookmark'));
                    const isBookmarked = saved && saved.surah == number && saved.ayah == index;

                    container.innerHTML += `
                        <p class="ayah" id="ayah-${index}">
                            <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark(${number}, ${index}, '${name}', event)"><i class="fas fa-map-marker-alt"></i></button>
                            <span onclick="playSpecificAyah(${index})" style="cursor:pointer; text-shadow:1px 1px 2px #000;">${text}</span>
                            <span style="display:inline-block; width:50px; height:50px; border-radius:50%; background:var(--bg-color); box-shadow:inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); text-align:center; line-height:50px; font-size:1.2rem; color:var(--accent); margin:0 15px; font-weight:bold;">${ayah.numberInSurah}</span>
                        </p>
                    `;
                });

                if(scrollToAyah !== null) {
                    setTimeout(() => {
                        const el = document.getElementById(`ayah-${scrollToAyah}`);
                        if(el) { el.scrollIntoView({behavior: 'smooth', block: 'center'}); el.classList.add('active-ayah'); setTimeout(() => el.classList.remove('active-ayah'), 3000); }
                    }, 500);
                }
            } catch(e) { document.getElementById('quran-loader').innerHTML = 'کێشەیەک هەیە دئینانا ئایەتان دا.'; }
        }

        function toggleBookmark(surah, ayah, name, event) {
            document.querySelectorAll('.bookmark-btn').forEach(b => b.classList.remove('active'));
            localStorage.setItem('quranBookmark', JSON.stringify({ surah, ayah, name }));
            event.currentTarget.classList.add('active');
            checkBookmark();
        }

        function checkBookmark() {
            const saved = JSON.parse(localStorage.getItem('quranBookmark'));
            const btn = document.getElementById('continue-reading-btn');
            if (saved) {
                btn.style.display = 'block';
                btn.innerHTML = `<i class="fas fa-bookmark"></i> بەردەوام بە ژ: ${saved.name} (ئایەتا ${saved.ayah + 1})`;
                btn.onclick = () => loadSurah(saved.surah, saved.name, saved.ayah);
            } else { btn.style.display = 'none'; }
        }

        function toggleQuranAudio() {
            const btn = document.getElementById('quran-play-btn');
            if (globalAudio.paused || !globalAudio.src) {
                playSpecificAyah(currentAyahIndex);
            } else { 
                globalAudio.pause(); 
                btn.innerHTML = '<i class="fas fa-play"></i>'; 
            }
        }

        function stopQuranAudio() {
            globalAudio.pause();
            globalAudio.currentTime = 0;
            const playBtn = document.getElementById('quran-play-btn');
            if(playBtn) playBtn.innerHTML = '<i class="fas fa-play"></i>';
            document.querySelectorAll('.ayah').forEach(a => a.classList.remove('active-ayah'));
            currentAyahIndex = 0;
        }

        function playSpecificAyah(index) {
            globalAudio.pause();
            currentAyahIndex = index;
            document.querySelectorAll('.ayah').forEach(a => a.classList.remove('active-ayah'));
            const el = document.getElementById(`ayah-${index}`);
            if(el) { el.classList.add('active-ayah'); el.scrollIntoView({behavior: 'smooth', block: 'center'}); }
            
            globalAudio.src = ayahTimings[index];
            globalAudio.playbackRate = playbackSpeeds[currentSpeedIndex]; // Apply selected speed
            document.getElementById('quran-play-btn').innerHTML = '<i class="fas fa-pause"></i>';
            globalAudio.play().catch(err => console.log("Audio Error:", err));
            
            globalAudio.onended = () => {
                if (currentAyahIndex + 1 < ayahTimings.length) playSpecificAyah(currentAyahIndex + 1);
                else stopQuranAudio();
            };
        }
        fetchSurahs();
    </script>
</body>
</html>
