<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نور الإيمان</title>
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com https://server8.mp3quran.net https://*.mp3quran.net https://www.youtube.com https://youtube.com data: blob:;">

    <!-- WhatsApp & Social Media Meta Tags -->
    <meta property="og:title" content="نور الإيمان" />
    <meta property="og:description" content="مالپەڕێ نور الإيمان بۆ خاندنا قورئانا پیرۆز، زکر و دوعایێن رۆژانە" />
    <meta property="og:image" content="https://sarmadhisarmadhi8-lang.github.io/quran1/nor.jpeg" />
    <meta property="og:url" content="https://sarmadhisarmadhi8-lang.github.io/quran1/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="نور الإيمان" />
    <meta name="twitter:description" content="مالپەڕێ نور الإيمان بۆ خاندنا قورئانا پیرۆز، زکر و دوعایێن رۆژانە" />
    <meta name="twitter:image" content="https://sarmadhisarmadhi8-lang.github.io/quran1/nor.jpeg" />

    <!-- PWA & Apple Touch Icons -->
    <link rel="apple-touch-icon" href="nor.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="نور الإيمان">
    <link rel="icon" type="image/jpeg" href="nor.jpeg">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1a3636;
            --secondary: #40534C;
            --accent: #D6BD98;
            --text-light: #F1F1F1;
            --glass-bg: rgba(26, 54, 54, 0.4);
            --glass-border: rgba(214, 189, 152, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f2020 0%, #1a3636 100%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Orbs Background */
        .ambient-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--secondary); top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: rgba(214, 189, 152, 0.1); bottom: -150px; right: -100px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(180deg); }
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f2020;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .splash-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px rgba(214, 189, 152, 0.3);
            animation: pulse 1.5s infinite alternate;
            object-fit: cover;
        }
        .splash-title {
            margin-top: 20px;
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: var(--accent);
            text-shadow: 0 2px 10px rgba(214, 189, 152, 0.5);
        }
        .splash-loader {
            margin-top: 30px;
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass-bg);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 20px rgba(214, 189, 152, 0.2); }
            100% { transform: scale(1.05); box-shadow: 0 0 40px rgba(214, 189, 152, 0.6); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* App Container */
        .app-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .logo-text {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 700;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Section Titles */
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 700;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 10%;
            width: 80%;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 2px 10px rgba(214,189,152,0.4);
        }

        /* 3D Glass Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* Counter Button (3D Neon) */
        .counter-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid var(--accent);
            color: var(--accent);
            font-size: 3rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(214, 189, 152, 0.1), inset 0 0 20px rgba(214, 189, 152, 0.1);
            transition: all 0.2s ease;
        }
        .counter-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 40px rgba(214, 189, 152, 0.4), inset 0 0 30px rgba(214, 189, 152, 0.4);
            background: rgba(214, 189, 152, 0.1);
        }
        .counter-target {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        .reset-btn {
            display: block;
            margin: 0 auto;
            background: transparent;
            border: 1px solid var(--text-light);
            color: var(--text-light);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Dua 0/3 Button */
        .dua-action-btn {
            width: 100%;
            padding: 12px;
            background: rgba(214, 189, 152, 0.1);
            border: 1px solid var(--accent);
            border-radius: 12px;
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }
        .dua-action-btn.completed {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
            color: #2ecc71;
        }

        /* Quran Styles */
        .search-box {
            width: 100%;
            padding: 15px 20px;
            border-radius: 15px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
        }
        .search-box::placeholder {
            color: rgba(255,255,255,0.6);
        }
        .continue-reading-btn {
            display: none;
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--accent), #c2a172);
            color: var(--primary);
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(214,189,152,0.3);
        }
        .surah-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .surah-item:hover { background: rgba(214, 189, 152, 0.1); }
        .surah-info { text-align: left; }
        .surah-name { font-family: 'Amiri', serif; font-size: 1.8rem; color: white; margin-bottom: 5px; }
        .surah-details { font-size: 0.9rem; color: var(--accent); }
        .surah-number {
            width: 45px;
            height: 45px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.2rem;
        }
        .ayah {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            line-height: 2.2;
            text-align: justify;
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 10px;
            transition: background 0.3s ease;
            position: relative;
        }
        .ayah.active-ayah { background: rgba(214, 189, 152, 0.2); }
        .ayah-number {
            display: inline-block;
            width: 35px;
            height: 35px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="%23D6BD98" stroke-width="5"/></svg>') no-repeat center;
            background-size: contain;
            text-align: center;
            line-height: 35px;
            font-size: 1rem;
            color: var(--accent);
            margin: 0 10px;
        }
        .bookmark-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 1.2rem;
            cursor: pointer;
            margin-right: 15px;
            transition: 0.3s;
        }
        .bookmark-btn.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        
        .audio-player-fixed {
            background: var(--glass-bg);
            border: 1px solid var(--accent);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .play-btn {
            background: var(--accent);
            color: var(--primary);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-info { text-align: center; }
        .audio-info h4 { color: white; margin-bottom: 5px; }
        .audio-info p { color: var(--accent); font-size: 0.8rem; }

        /* Menu */
        .side-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100vh;
            background: var(--primary);
            padding: 30px 20px;
            transition: 0.4s ease;
            z-index: 1000;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }
        .side-menu.active { right: 0; }
        .close-menu { color: white; font-size: 1.5rem; background: none; border: none; cursor: pointer; float: left; }
        .menu-items { margin-top: 60px; display: flex; flex-direction: column; gap: 15px; }
        .menu-item {
            padding: 15px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--glass-bg);
            transition: 0.3s;
        }
        .menu-item:hover, .menu-item.active { background: rgba(214, 189, 152, 0.2); color: var(--accent); }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
        }
        .overlay.active { display: block; }
        
        .section { display: none; animation: fadeIn 0.5s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Loading Screen for Quran */
        .quran-loader {
            display: none;
            text-align: center;
            padding: 50px 0;
            color: var(--accent);
            font-size: 1.5rem;
        }
        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        .back-btn {
            background: var(--glass-bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="nor.jpeg" alt="نور الإيمان" class="splash-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23D6BD98\'/><text x=\'50\' y=\'65\' font-size=\'50\' text-anchor=\'middle\' fill=\'%231a3636\'>N</text></svg>'">
        <h1 class="splash-title">نور الإيمان</h1>
        <div class="splash-loader"></div>
    </div>

    <div class="ambient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
            <div class="logo-container">
                <span class="logo-text">نور الإيمان</span>
                <img src="nor.jpeg" alt="Logo" class="site-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23D6BD98\'/><text x=\'50\' y=\'65\' font-size=\'50\' text-anchor=\'middle\' fill=\'%231a3636\'>N</text></svg>'">
            </div>
        </header>

        <!-- Zikr Section -->
        <main id="zikr-section" class="section active">
            <h2 class="section-title">زکرێ رۆژانە</h2>
            <div id="zikr-container"></div>
        </main>

        <!-- Quran List Section -->
        <main id="quran-list-section" class="section">
            <h2 class="section-title">قورئانا پیرۆز</h2>
            <p style="text-align: center; color: var(--accent); margin-bottom: 20px;">١١٤ سورەت - دەنگێ مشاري العفاسي</p>
            <button id="continue-reading-btn" class="continue-reading-btn" onclick="continueReading()">
                <i class="fas fa-bookmark"></i> بەردەوام بە ژ جهێ تە هێلای
            </button>
            <input type="text" id="surah-search" class="search-box" placeholder="ل ناڤێ سورەتێ بگەڕە..." onkeyup="searchSurah()">
            <div id="surahs-container"></div>
        </main>

        <!-- Quran Reader Section -->
        <main id="quran-reader-section" class="section">
            <div class="top-bar">
                <button class="back-btn" onclick="showSection('quran-list-section')"><i class="fas fa-arrow-right"></i></button>
                <h2 id="current-surah-name" style="font-family: 'Amiri'; color: white;"></h2>
            </div>
            
            <div class="audio-player-fixed">
                <button id="quran-play-btn" class="play-btn" onclick="toggleQuranAudio()">
                    <i class="fas fa-play"></i>
                </button>
                <div class="audio-info">
                    <h4>مشاري العفاسي</h4>
                    <p>لۆتۆسکرۆل چالاکە</p>
                </div>
                <button class="play-btn" style="background:transparent; border:1px solid var(--accent); color:var(--accent);" onclick="stopQuranAudio()">
                    <i class="fas fa-stop"></i>
                </button>
            </div>

            <div class="quran-loader" id="quran-loader"><i class="fas fa-spinner fa-spin"></i> ئایەت دهێن...</div>
            <div id="ayahs-container" style="background: var(--glass-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--glass-border);"></div>
        </main>

        <!-- Prayer Section -->
        <main id="prayer-section" class="section">
            <h2 class="section-title">فێرکرنا نڤێژێ</h2>
            <div class="glass-card">
                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px;">
                    <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" src="https://www.youtube.com/embed/5F2v_7n91rA" allowfullscreen></iframe>
                </div>
            </div>
        </main>

        <!-- Dua Section -->
        <main id="dua-section" class="section">
            <h2 class="section-title">دوعایێن خەوێ و رۆژانە</h2>
            <div id="dua-container"></div>
        </main>
    </div>

    <!-- Sidebar Menu -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="side-menu" id="side-menu">
        <button class="close-menu" onclick="toggleMenu()"><i class="fas fa-times"></i></button>
        <h3 style="color: var(--accent); text-align: center; margin-top: 10px; font-size: 1.5rem;">پێڕست</h3>
        <div class="menu-items">
            <a href="#" class="menu-item active" onclick="showSection('zikr-section'); toggleMenu()">
                <i class="fas fa-ring"></i> زکرێ رۆژانە
            </a>
            <a href="#" class="menu-item" onclick="showSection('prayer-section'); toggleMenu()">
                <i class="fas fa-praying-hands"></i> فێرکرنا نڤێژێ
            </a>
            <a href="#" class="menu-item" onclick="showSection('quran-list-section'); toggleMenu()">
                <i class="fas fa-book-quran"></i> قورئانا پیرۆز
            </a>
            <a href="#" class="menu-item" onclick="showSection('dua-section'); toggleMenu()">
                <i class="fas fa-hands-praying"></i> دوعایێن خەوێ و رۆژانە
            </a>
        </div>
    </nav>

    <script>
        // ======= ANTI-HACK / SECURITY SYSTEM =======
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
        };
        // ===========================================

        // Splash Screen Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 2500);
            checkDailyReset();
            checkBookmark();
        });

        // Menu Logic
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            window.scrollTo(0,0);
            if(sectionId !== 'quran-reader-section') {
                stopQuranAudio();
            }
        }

        // Daily Reset Logic (Midnight)
        function checkDailyReset() {
            const lastReset = localStorage.getItem('lastResetDate');
            const today = new Date().toLocaleDateString();
            if (lastReset !== today) {
                // Reset all Dua counts
                duas.forEach((_, index) => localStorage.setItem(`dua_count_${index}`, 0));
                localStorage.setItem('lastResetDate', today);
            }
        }

        // --- ZIKR SYSTEM ---
        const azkar = [
            { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", target: 100 },
            { text: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", target: 100 },
            { text: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", target: 100 }
        ];

        function renderAzkar() {
            const container = document.getElementById('zikr-container');
            container.innerHTML = '';
            azkar.forEach((zkr, index) => {
                let count = 0;
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <h3 style="font-family:'Amiri'; text-align:center; font-size:1.8rem; margin-bottom:20px;">${zkr.text}</h3>
                    <button class="counter-btn" id="btn-${index}" onclick="incrementZikr(${index}, ${zkr.target})">
                        <span id="count-${index}">0</span>
                        <span class="counter-target">ژ ${zkr.target}</span>
                    </button>
                    <button class="reset-btn" onclick="resetZikr(${index})"><i class="fas fa-redo"></i> دووبارەکرن</button>
                `;
                container.appendChild(card);
            });
        }

        function incrementZikr(id, target) {
            const countSpan = document.getElementById(`count-${id}`);
            let count = parseInt(countSpan.innerText);
            if (count < target) {
                count++;
                countSpan.innerText = count;
                if(window.navigator.vibrate) window.navigator.vibrate(50);
            }
        }

        function resetZikr(id) {
            document.getElementById(`count-${id}`).innerText = '0';
        }
        renderAzkar();

        // --- DUA SYSTEM (Badini + Smart Counter) ---
        const duas = [
            { arabic: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وبِكَ أَرْفَعُهُ...", kurdish: "ب ناڤێ تە ئەی پەروەردگارێ من، من تەنیشتا خۆ دانا و ب تە رادکەم..." },
            { arabic: "اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا...", kurdish: "خودایێ من، تە گیانێ من ئافراندیە و تو دێ وەغەر پێ کەی..." },
            { arabic: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", kurdish: "ب ناڤێ تە ئەی خودا دمرم و دژیم (دنڤم و رادبم)" },
            { arabic: "بِسْمِ اللَّهِ ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ", kurdish: "ب ناڤێ خودێ، خودایێ من ئەز ب تە دهێمە پاراستن ژ پیسی و شەیتانان (دوعایا چوونە دەستئاڤێ)" },
            { arabic: "غُفْرَانَكَ", kurdish: "داخوازا لێخۆشبوونێ ژ تە دکەم (دوعایا دەرکەفتن ژ دەستئاڤێ)" }
        ];

        function renderDuas() {
            const container = document.getElementById('dua-container');
            container.innerHTML = '';
            duas.forEach((dua, index) => {
                let savedCount = parseInt(localStorage.getItem(`dua_count_${index}`)) || 0;
                let isCompleted = savedCount >= 3;
                
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <p style="font-family:'Amiri'; font-size:1.5rem; text-align:center; margin-bottom:15px;">${dua.arabic}</p>
                    <p style="color:var(--accent); text-align:center; font-size:1rem; margin-bottom:15px; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">${dua.kurdish}</p>
                    <button id="dua-btn-${index}" class="dua-action-btn ${isCompleted ? 'completed' : ''}" onclick="incrementDua(${index})">
                        ${isCompleted ? 'تەمام بوو ✔' : `خاندن (${savedCount}/3)`}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function incrementDua(index) {
            let count = parseInt(localStorage.getItem(`dua_count_${index}`)) || 0;
            if (count < 3) {
                count++;
                localStorage.setItem(`dua_count_${index}`, count);
                const btn = document.getElementById(`dua-btn-${index}`);
                if (count >= 3) {
                    btn.classList.add('completed');
                    btn.innerHTML = 'تەمام بوو ✔';
                } else {
                    btn.innerHTML = `خاندن (${count}/3)`;
                }
                if(window.navigator.vibrate) window.navigator.vibrate(30);
            }
        }
        renderDuas();

        // --- QURAN SYSTEM ---
        let surahList = [];
        let currentAudio = null;
        let ayahTimings = [];
        let currentAyahIndex = 0;

        function removeDiacritics(str) {
            return str.replace(/[ًٌٍَُِّْٰ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه');
        }

        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahList = data.data;
                renderSurahs(surahList);
            } catch (error) {
                console.error("Error fetching surahs");
            }
        }

        function renderSurahs(list) {
            const container = document.getElementById('surahs-container');
            container.innerHTML = '';
            list.forEach(surah => {
                const div = document.createElement('div');
                div.className = 'surah-item';
                div.onclick = () => loadSurah(surah.number, surah.name);
                div.innerHTML = `
                    <div class="surah-info">
                        <div class="surah-name">${surah.name}</div>
                        <div class="surah-details">${surah.revelationType === 'Meccan' ? 'مەککی' : 'مەدەنی'} - ${surah.numberOfAyahs} ئایەت</div>
                    </div>
                    <div class="surah-number">${surah.number}</div>
                `;
                container.appendChild(div);
            });
        }

        function searchSurah() {
            const input = removeDiacritics(document.getElementById('surah-search').value.toLowerCase());
            const filtered = surahList.filter(s => removeDiacritics(s.name).includes(input) || removeDiacritics(s.englishName.toLowerCase()).includes(input));
            renderSurahs(filtered);
        }

        async function loadSurah(number, name, scrollToAyah = null) {
            showSection('quran-reader-section');
            document.getElementById('current-surah-name').innerText = name;
            document.getElementById('quran-loader').style.display = 'block';
            document.getElementById('ayahs-container').innerHTML = '';
            stopQuranAudio();
            
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${number}/ar.alafasy`);
                const data = await res.json();
                document.getElementById('quran-loader').style.display = 'none';
                
                const ayahs = data.data.ayahs;
                ayahTimings = ayahs.map(a => a.audio);
                
                const container = document.getElementById('ayahs-container');
                ayahs.forEach((ayah, index) => {
                    let text = ayah.text;
                    if(number !== 1 && index === 0 && text.startsWith("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ")) {
                        text = text.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
                        if(index === 0) {
                            const bismillah = document.createElement('div');
                            bismillah.style.textAlign = 'center';
                            bismillah.style.fontFamily = 'Amiri';
                            bismillah.style.fontSize = '1.8rem';
                            bismillah.style.marginBottom = '20px';
                            bismillah.innerText = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
                            container.appendChild(bismillah);
                        }
                    }
                    
                    const p = document.createElement('p');
                    p.className = 'ayah';
                    p.id = `ayah-${index}`;
                    
                    let bookmarkClass = '';
                    const savedBookmark = JSON.parse(localStorage.getItem('quranBookmark'));
                    if(savedBookmark && savedBookmark.surah == number && savedBookmark.ayah == index) {
                        bookmarkClass = 'active';
                    }

                    p.innerHTML = `
                        <button class="bookmark-btn ${bookmarkClass}" onclick="toggleBookmark(${number}, ${index}, '${name}')"><i class="fas fa-map-marker-alt"></i></button>
                        <span onclick="playSpecificAyah(${index})">${text}</span>
                        <span class="ayah-number">${ayah.numberInSurah}</span>
                    `;
                    container.appendChild(p);
                });

                if(scrollToAyah !== null) {
                    setTimeout(() => {
                        const el = document.getElementById(`ayah-${scrollToAyah}`);
                        if(el) {
                            el.scrollIntoView({behavior: 'smooth', block: 'center'});
                            el.classList.add('active-ayah');
                            setTimeout(() => el.classList.remove('active-ayah'), 3000);
                        }
                    }, 500);
                }

            } catch(e) {
                document.getElementById('quran-loader').innerHTML = 'کێشەیەک هەیە دئینانا ئایەتان دا، تکایە ئینتەرنێتێ کۆنترۆل بکە.';
            }
        }

        // Bookmark Logic
        function toggleBookmark(surah, ayah, name) {
            document.querySelectorAll('.bookmark-btn').forEach(b => b.classList.remove('active'));
            const data = { surah, ayah, name };
            localStorage.setItem('quranBookmark', JSON.stringify(data));
            event.currentTarget.classList.add('active');
            checkBookmark();
        }

        function checkBookmark() {
            const saved = JSON.parse(localStorage.getItem('quranBookmark'));
            const btn = document.getElementById('continue-reading-btn');
            if (saved) {
                btn.style.display = 'block';
                btn.innerHTML = `<i class="fas fa-bookmark"></i> بەردەوام بە ژ: ${saved.name} (ئایەتا ${saved.ayah + 1})`;
                btn.onclick = () => loadSurah(saved.surah, saved.name, saved.ayah);
            } else {
                btn.style.display = 'none';
            }
        }

        // Audio Logic
        function toggleQuranAudio() {
            const btn = document.getElementById('quran-play-btn');
            if (!currentAudio || currentAudio.paused) {
                playSpecificAyah(currentAyahIndex);
            } else {
                currentAudio.pause();
                btn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function stopQuranAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            document.getElementById('quran-play-btn').innerHTML = '<i class="fas fa-play"></i>';
            document.querySelectorAll('.ayah').forEach(a => a.classList.remove('active-ayah'));
            currentAyahIndex = 0;
        }

        function playSpecificAyah(index) {
            if (currentAudio) currentAudio.pause();
            currentAyahIndex = index;
            
            document.querySelectorAll('.ayah').forEach(a => a.classList.remove('active-ayah'));
            const currentEl = document.getElementById(`ayah-${index}`);
            if(currentEl) {
                currentEl.classList.add('active-ayah');
                currentEl.scrollIntoView({behavior: 'smooth', block: 'center'});
            }

            currentAudio = new Audio(ayahTimings[index]);
            document.getElementById('quran-play-btn').innerHTML = '<i class="fas fa-pause"></i>';
            currentAudio.play();
            
            currentAudio.onended = () => {
                if (currentAyahIndex + 1 < ayahTimings.length) {
                    playSpecificAyah(currentAyahIndex + 1);
                } else {
                    stopQuranAudio();
                }
            };
        }

        fetchSurahs();
    </script>
</body>
</html>
